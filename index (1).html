<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивный коллаж</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:Arial,sans-serif}
.collage{position:relative;width:100%;max-width:1680px;margin:0 auto;line-height:0}
.collage>img{display:block;width:100%;height:auto}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;pointer-events:auto;padding:0;margin:0;-webkit-tap-highlight-color:transparent}
.hotspot:focus-visible{outline:3px solid #111;outline-offset:2px}
.modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.backdrop{position:absolute;inset:0;border:0;background:rgba(0,0,0,.82);cursor:pointer}
.dialog{position:relative;z-index:1;width:min(920px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 22px 80px rgba(0,0,0,.35)}
.close{position:absolute;right:10px;top:10px;z-index:5;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.96);font:32px/1 Arial,sans-serif;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.direct-photo{display:block;max-width:100%;width:auto;height:auto;max-height:80vh;margin:0 auto;border-radius:10px;object-fit:contain;background:#eee}
.crop-wrap{position:relative;margin:0 auto;overflow:hidden;border-radius:10px;background:#eee}
.crop-wrap img{position:absolute;display:block;max-width:none;height:auto}
.number{padding:14px 4px 2px;text-align:center;font-size:20px;font-weight:600;line-height:1.3;color:#111}
@media(max-width:640px){.modal{padding:10px}.dialog{width:98vw;padding:10px;border-radius:12px}.number{font-size:18px}}
</style>
</head>
<body>
<div class="collage">
  <img src="maket.png" alt="Коллаж">
  <div class="hotspots" id="hotspots"></div>
</div>
<div class="modal" id="modal" aria-hidden="true">
  <button class="backdrop" type="button" aria-label="Закрыть"></button>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="num">
    <button class="close" type="button" aria-label="Закрыть">×</button>
    <div id="media"></div>
    <div class="number" id="num"></div>
  </div>
</div>

const layer=document.getElementById('hotspots');
const modal=document.getElementById('modal');
const media=document.getElementById('media');
const num=document.getElementById('num');
const closeBtn=modal.querySelector('.close');
const backdrop=modal.querySelector('.backdrop');
items.forEach(h=>{
  const b=document.createElement('button');
  b.type='button'; b.className='hotspot'; b.setAttribute('aria-label','Фото №'+h.n);
  b.style.left=h.x+'%'; b.style.top=h.y+'%'; b.style.width=h.w+'%'; b.style.height=h.h+'%';
  b.addEventListener('click',()=>openItem(h)); layer.appendChild(b);
});
function openItem(h){
  media.innerHTML='';
  if(h.crop){
    const c=h.crop;
    const wrap=document.createElement('div'); wrap.className='crop-wrap';
    wrap.style.aspectRatio=c.w+' / '+c.h;
    wrap.style.width=Math.min(c.w,780)+'px';
    wrap.style.maxWidth='100%';
    const img=document.createElement('img'); img.src=h.src; img.alt='Фото №'+h.n;
    img.style.width=(c.sw/c.w*100)+'%';
    img.style.left=(-c.x/c.w*100)+'%';
    img.style.top=(-c.y/c.h*100)+'%';
    wrap.appendChild(img); media.appendChild(wrap);
  } else {
    const img=document.createElement('img'); img.className='direct-photo'; img.src=h.src; img.alt='Фото №'+h.n;
    img.addEventListener('load',()=>{
      const limit=Math.min(img.naturalWidth || 900, 900);
      img.style.width=limit+'px';
      img.style.maxWidth='100%';
      img.style.height='auto';
    });
    media.appendChild(img);
  }
  num.textContent='№'+h.n;
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); document.documentElement.style.overflow='hidden'; closeBtn.focus();
}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';}
closeBtn.addEventListener('click',closeModal); backdrop.addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});
